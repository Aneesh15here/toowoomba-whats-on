name: Collect events

on:
  schedule:
    # 06:00 Australia/Brisbane (UTC+10, no daylight saving)
    - cron: "0 20 * * *"
    # 18:00 Australia/Brisbane
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect public listings
        run: node scripts/collect.mjs

      - name: Commit data/events.json if it changed
        run: |
          if git diff --quiet -- data/events.json; then
            echo "events.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Update collected Toowoomba events"
          git push
