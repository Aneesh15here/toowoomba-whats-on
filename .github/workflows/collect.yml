name: Collect events

on:
  schedule:
    # 06:00 Australia/Brisbane (UTC+10, no daylight saving)
    - cron: "0 20 * * *"
    # 18:00 Australia/Brisbane
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect public listings and generate pages
        run: node scripts/collect.mjs

      - name: Commit listings and generated pages if they changed
        run: |
          git add -A -- data/events.json data/occurrences.json index.html things-to-do.html sitemap.xml robots.txt feed.xml atom.xml events.ics 404.html events category suburb this-weekend this-week garage-sales things-to-do search
          if git diff --cached --quiet; then
            echo "listings and pages unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update collected Toowoomba events and SEO pages"
          git push
